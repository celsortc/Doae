# Compila o Doaê no GitHub e gera o Doae.jar.
# - Em cada push numa branch doae/* ou pull request: confere se compila e guarda o .jar.
# - Numa tag v* (ex.: v1.0): publica o Doae.jar na página de Releases.
name: Build

on:
  push:
    branches: ['doae/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Gerar Doae.jar
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: Doae
          path: target/Doae.jar
      - name: Publicar no Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/Doae.jar
